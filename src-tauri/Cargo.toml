[package]
name = "deskpresence"
description = "DeskPresence: Discord Rich Presence for the applications you use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "deskpresence"

[lib]
name = "deskpresence_lib"
path = "src/lib.rs"

[[bin]]
name = "deskpresence"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
deskpresence-core = { path = "../crates/deskpresence-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "registry", "std", "ansi"] }
unicode-segmentation = "1.12"
fastrand = "2.3"

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
