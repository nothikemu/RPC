[package]
name = "deskpresence-core"
description = "Platform logic for DeskPresence: application detection, rules, templates, presence selection and Discord IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Generates TypeScript bindings for the UI-facing types into `../../src/lib/bindings`
# when running `cargo test --features ts`.
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64 = "0.22"
fastrand = "2.3"
png = "0.18"
unicode-segmentation = "1.12"
ts-rs = { version = "12", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
